name: Nova demanda de post
description: Pede um post de LinkedIn ao escritório de agentes (Tiago escreve, Roberto revisa, Eloah cria a arte).
title: "[Post] "
body:
  - type: markdown
    attributes:
      value: |
        Ao criar esta issue, o workflow **Escritório de agentes** coloca o Tiago, o Roberto e Eloah para trabalhar.
        O post revisado e a arte voltam aqui como comentário e aparecem no painel do GitHub Pages.
        Só issues abertas pelo dono do repositório disparam a esteira.
  - type: input
    id: tema
    attributes:
      label: Tema do post
      placeholder: Por que IA sem dados organizados é só demo bonita
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: Descrição do post
      description: A história, a ideia central, fatos e números reais que devem entrar e o ângulo que você quer.
    validations:
      required: true
  - type: input
    id: objetivo
    attributes:
      label: Objetivo
      placeholder: Gerar reflexão, divulgar evento...
  - type: input
    id: publico
    attributes:
      label: Público
      placeholder: CIOs, CTOs, conselheiros...
  - type: input
    id: cta
    attributes:
      label: Chamada para ação
      placeholder: Comente como sua empresa trata isso
  - type: textarea
    id: observacoes
    attributes:
      label: Observações
      placeholder: Tom, palavras proibidas, links...
