name: Escritório de agentes (posts)

# Uma issue "[Post] ..." aberta pelo dono do repositório (formulário
# .github/ISSUE_TEMPLATE/demanda-post.yml) vira uma demanda: Tiago escreve,
# Roberto revisa (até 3 rodadas) e Eloah cria a arte. O resultado é commitado
# em escritorio-agentes/entregas/ (lido pelo painel no GitHub Pages) e volta
# como comentário na issue. Cada passo dos agentes é transmitido ao vivo para
# o painel via Supabase (edge function escritorio-evento). Para refazer,
# adicione o label "refazer".

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: escritorio-agentes
  cancel-in-progress: false

jobs:
  esteira:
    # Repositório público: só o dono dispara, para ninguém gastar seus créditos
    # nem injetar instruções nos agentes.
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Post]') &&
      (github.event.action == 'opened' || github.event.label.name == 'refazer')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: escritorio-agentes
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Avisar na issue
        run: |
          gh issue edit "$ISSUE" --remove-label refazer || true
          gh issue comment "$ISSUE" --body "🖋️ A demanda chegou na mesa do Tiago. Acompanhe a esteira em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Instalar Claude Code e Playwright
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install
          npx playwright install --with-deps chromium

      - name: Criar briefing a partir da issue
        id: briefing
        run: node scripts/briefing-da-issue.mjs

      - name: Rodar a esteira (Tiago, Roberto, Eloah)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Transmite cada passo dos agentes ao painel (Supabase Realtime).
          # Opcional: sem ele, a esteira roda igual, só sem o "ao vivo".
          ESCRITORIO_TOKEN: ${{ secrets.ESCRITORIO_TOKEN }}
        run: node scripts/rodar-esteira.mjs "${{ steps.briefing.outputs.id }}"

      - name: Publicar entregas no repositório (GitHub Pages)
        if: steps.briefing.outputs.id != ''
        env:
          ID: ${{ steps.briefing.outputs.id }}
        run: |
          node scripts/gerar-indice.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "entregas/$ID" entregas/index.json
          git commit -m "Escritório: entrega da issue #$ISSUE ($ID)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && break; sleep 5; done

      - name: Responder na issue
        if: steps.briefing.outputs.id != ''
        env:
          ID: ${{ steps.briefing.outputs.id }}
        run: |
          BASE="${{ github.server_url }}/${{ github.repository }}/raw/${{ github.event.repository.default_branch }}/escritorio-agentes/entregas/$ID"
          node scripts/comentario-issue.mjs "$ID" "$BASE" > "$RUNNER_TEMP/comentario.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comentario.md"
          if [ -f "entregas/$ID/arte.png" ] && [ -f "entregas/$ID/post-final.md" ]; then
            gh issue close "$ISSUE" --reason completed
          fi
