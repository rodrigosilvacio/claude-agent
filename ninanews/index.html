<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NinaNews — Notícias de IA</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      padding: 2.5rem 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16161a; }
    }
    .card {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #232329; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.4rem;
      color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) {
      h1 { color: #f2f2f2; }
    }
    p.subtitle {
      margin: 0 0 1.5rem;
      font-size: 0.9rem;
      color: #6e6e73;
    }
    @media (prefers-color-scheme: dark) {
      p.subtitle { color: #a1a1a6; }
    }
    p.build-info {
      margin: -1rem 0 1.5rem;
      font-size: 0.72rem;
      color: #a1a1a6;
    }
    @media (prefers-color-scheme: dark) {
      p.build-info { color: #6e6e73; }
    }
    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: #0071e3;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      color: #0071e3;
      border: 1px solid #0071e3;
      margin-top: 0.7rem;
    }
    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.2em;
    }
    #message.error { color: #d92d20; }
    #result-wrapper {
      display: none;
      margin-top: 1.8rem;
    }
    #buscado-em {
      font-size: 0.78rem;
      color: #a1a1a6;
      margin: 0 0 1.2rem;
      text-align: center;
    }
    .noticia-card {
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      .noticia-card { border-color: #3a3a40; }
    }
    .noticia-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) {
      .noticia-card h3 { color: #f2f2f2; }
    }
    .noticia-card p {
      margin: 0 0 0.5rem;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #444;
    }
    @media (prefers-color-scheme: dark) {
      .noticia-card p { color: #ccc; }
    }
    .noticia-card a {
      font-size: 0.78rem;
      color: #0071e3;
      text-decoration: none;
      word-break: break-word;
    }
    .noticia-card a:hover { text-decoration: underline; }
    hr.divider {
      border: none;
      border-top: 1px solid #d2d2d7;
      margin: 1.6rem 0 1.4rem;
    }
    @media (prefers-color-scheme: dark) {
      hr.divider { border-top-color: #3a3a40; }
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #444;
    }
    @media (prefers-color-scheme: dark) {
      label { color: #ccc; }
    }
    #char-count {
      font-weight: 400;
      font-size: 0.78rem;
      color: #a1a1a6;
    }
    #char-count.over { color: #d92d20; font-weight: 700; }
    textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 0.8rem 0.9rem;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      line-height: 1.5;
      background: #fff;
      color: #1d1d1f;
      margin-bottom: 0.9rem;
    }
    @media (prefers-color-scheme: dark) {
      textarea {
        background: #17171c;
        border-color: #3a3a40;
        color: #f2f2f2;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NinaNews — Notícias de IA 📰</h1>
    <p class="subtitle">As 5 notícias mais relevantes sobre inteligência artificial no Brasil hoje, com resumo executivo pronto para o LinkedIn.</p>
    <p class="build-info">build: <strong>2026-08-03 00:00 UTC</strong> — se essa data não bater com o último push, o navegador está com cache antigo.</p>

    <button type="button" id="buscar-btn">🔄 Buscar notícias de hoje</button>
    <div id="message"></div>

    <div id="result-wrapper">
      <p id="buscado-em"></p>

      <div id="noticias-list"></div>

      <hr class="divider" />

      <label for="post-final">
        <span>Texto pronto para o LinkedIn</span>
        <span id="char-count"></span>
      </label>
      <textarea id="post-final" readonly></textarea>
      <button type="button" class="secondary" id="copy-btn">Copiar texto</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://xtrvojnauvkkterogrst.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JmhdMN8S7lSpCeaJANw_lQ_RRwZ2_OT";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const buscarBtn = document.getElementById("buscar-btn");
    const messageEl = document.getElementById("message");
    const resultWrapper = document.getElementById("result-wrapper");
    const buscadoEmEl = document.getElementById("buscado-em");
    const noticiasListEl = document.getElementById("noticias-list");
    const postFinalEl = document.getElementById("post-final");
    const charCountEl = document.getElementById("char-count");
    const copyBtn = document.getElementById("copy-btn");

    function renderNoticias(noticias) {
      noticiasListEl.innerHTML = "";
      noticias.forEach((n, i) => {
        const card = document.createElement("div");
        card.className = "noticia-card";

        const h3 = document.createElement("h3");
        h3.textContent = `${i + 1}. ${n.titulo}`;

        const p = document.createElement("p");
        p.textContent = n.resumo;

        card.appendChild(h3);
        card.appendChild(p);

        if (n.url) {
          const a = document.createElement("a");
          a.href = n.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = n.fonte || n.url;
          card.appendChild(a);
        }

        noticiasListEl.appendChild(card);
      });
    }

    function renderCharCount(length) {
      charCountEl.textContent = `${length} / 3000 caracteres`;
      charCountEl.classList.toggle("over", length > 3000);
    }

    buscarBtn.addEventListener("click", async () => {
      buscarBtn.disabled = true;
      buscarBtn.textContent = "Buscando e resumindo as notícias de hoje...";
      messageEl.textContent = "";
      messageEl.className = "";
      resultWrapper.style.display = "none";

      const { data, error } = await supabase.functions.invoke("ninanews-buscar", { body: {} });

      if (error || !data?.noticias || !data?.post_final) {
        messageEl.textContent = data?.error || error?.message || "Erro ao buscar as notícias.";
        messageEl.className = "error";
      } else {
        const dataFormatada = new Date(data.buscado_em).toLocaleString("pt-BR", {
          timeZone: "America/Sao_Paulo",
        });
        buscadoEmEl.textContent = `Notícias buscadas em ${dataFormatada}`;

        renderNoticias(data.noticias);
        postFinalEl.value = data.post_final;
        renderCharCount(data.post_final_length ?? data.post_final.length);

        resultWrapper.style.display = "block";
      }

      buscarBtn.disabled = false;
      buscarBtn.textContent = "🔄 Buscar notícias de hoje";
    });

    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(postFinalEl.value);
      copyBtn.textContent = "Copiado!";
      setTimeout(() => { copyBtn.textContent = "Copiar texto"; }, 1500);
    });
  </script>
</body>
</html>
